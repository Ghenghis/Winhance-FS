name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  DOTNET_VERSION: "9.0.x"
  RUST_VERSION: "stable"
  PROJECT_PATH: "src/Winhance.WPF/Winhance.WPF.csproj"
  APP_NAME: "Winhance"

jobs:
  # Build Rust library first (optional - only if Rust components exist)
  rust-build:
    name: Build Rust Library
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src/Cargo.lock') }}

      - name: Build Rust library
        run: cargo build --manifest-path src/Cargo.toml --release

      - name: Run Rust tests
        run: cargo test --manifest-path src/Cargo.toml --release

  build:
    name: Build ${{ matrix.config.name }}
    runs-on: windows-latest
    needs: rust-build
    strategy:
      fail-fast: false
      matrix:
        config:
          # ========== x64 Architecture ==========
          - name: Windows x64
            runtime: win-x64
            artifact_name: Winhance-x64
            self_contained: true
            single_file: false
          - name: Windows x64 Portable
            runtime: win-x64
            artifact_name: Winhance-x64-Portable
            self_contained: true
            single_file: true
          - name: Windows x64 Framework-Dependent
            runtime: win-x64
            artifact_name: Winhance-x64-FrameworkDependent
            self_contained: false
            single_file: false
          - name: Windows x64 Framework-Dependent Portable
            runtime: win-x64
            artifact_name: Winhance-x64-FrameworkDependent-Portable
            self_contained: false
            single_file: true
          # ========== x86 Architecture ==========
          - name: Windows x86
            runtime: win-x86
            artifact_name: Winhance-x86
            self_contained: true
            single_file: false
          - name: Windows x86 Portable
            runtime: win-x86
            artifact_name: Winhance-x86-Portable
            self_contained: true
            single_file: true
          - name: Windows x86 Framework-Dependent
            runtime: win-x86
            artifact_name: Winhance-x86-FrameworkDependent
            self_contained: false
            single_file: false
          - name: Windows x86 Framework-Dependent Portable
            runtime: win-x86
            artifact_name: Winhance-x86-FrameworkDependent-Portable
            self_contained: false
            single_file: true
          # ========== ARM64 Architecture ==========
          - name: Windows ARM64
            runtime: win-arm64
            artifact_name: Winhance-ARM64
            self_contained: true
            single_file: false
          - name: Windows ARM64 Portable
            runtime: win-arm64
            artifact_name: Winhance-ARM64-Portable
            self_contained: true
            single_file: true
          - name: Windows ARM64 Framework-Dependent
            runtime: win-arm64
            artifact_name: Winhance-ARM64-FrameworkDependent
            self_contained: false
            single_file: false
          - name: Windows ARM64 Framework-Dependent Portable
            runtime: win-arm64
            artifact_name: Winhance-ARM64-FrameworkDependent-Portable
            self_contained: false
            single_file: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          # Remove 'v' prefix if present
          VERSION_NUM=${VERSION#v}
          # Extract numeric version for AssemblyVersion (strip any suffix like -alpha, -beta, -test)
          ASSEMBLY_VERSION=$(echo "$VERSION_NUM" | sed 's/-.*$//' | sed 's/^\([0-9]*\.[0-9]*\.[0-9]*\)$/\1.0/' | sed 's/^\([0-9]*\.[0-9]*\)$/\1.0.0/' | sed 's/^\([0-9]*\)$/\1.0.0.0/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "assembly_version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT

      - name: Build application
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime ${{ matrix.config.runtime }} `
            --self-contained ${{ matrix.config.self_contained }} `
            -p:PublishSingleFile=${{ matrix.config.single_file }} `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=${{ matrix.config.self_contained }} `
            -p:Version=${{ steps.version.outputs.version_num }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version_num }} `
            --output ./publish/${{ matrix.config.artifact_name }}

      - name: Create release package
        shell: pwsh
        run: |
          $publishPath = "./publish/${{ matrix.config.artifact_name }}"
          $zipName = "${{ matrix.config.artifact_name }}-${{ steps.version.outputs.version }}.zip"

          # Create zip archive
          Compress-Archive -Path "$publishPath/*" -DestinationPath "./publish/$zipName" -Force

          # Calculate SHA256
          $hash = Get-FileHash "./publish/$zipName" -Algorithm SHA256
          $hashValue = $hash.Hash
          Set-Content -Path "./publish/$zipName.sha256" -Value "$hashValue  $zipName"

          echo "Created: $zipName"
          echo "SHA256: $hashValue"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact_name }}
          path: |
            ./publish/${{ matrix.config.artifact_name }}-${{ steps.version.outputs.version }}.zip
            ./publish/${{ matrix.config.artifact_name }}-${{ steps.version.outputs.version }}.zip.sha256
          retention-days: 30

  # MSIX Installer Builds for Microsoft Store
  msix-build:
    name: Build MSIX ${{ matrix.arch }}
    runs-on: windows-latest
    needs: rust-build
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            runtime: win-x64
          - arch: x86
            runtime: win-x86
          - arch: arm64
            runtime: win-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          ASSEMBLY_VERSION=$(echo "$VERSION_NUM" | sed 's/-.*$//' | sed 's/^\([0-9]*\.[0-9]*\.[0-9]*\)$/\1.0/' | sed 's/^\([0-9]*\.[0-9]*\)$/\1.0.0/' | sed 's/^\([0-9]*\)$/\1.0.0.0/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "assembly_version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build MSIX package
        shell: pwsh
        run: |
          # Build the application
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.version_num }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} `
            --output ./publish/msix-${{ matrix.arch }}

          # Create MSIX directory structure
          $msixDir = "./msix-package"
          New-Item -ItemType Directory -Force -Path $msixDir

          # Copy published files
          Copy-Item -Path "./publish/msix-${{ matrix.arch }}/*" -Destination $msixDir -Recurse

          # Create AppxManifest.xml for MSIX
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:uap3="http://schemas.microsoft.com/appx/manifest/uap/windows10/3"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
                   IgnorableNamespaces="uap uap3 rescap">
            <Identity Name="Winhance.Winhance" Publisher="CN=Winhance, O=Winhance Team, C=US" Version="${{ steps.version.outputs.assembly_version }}" ProcessorArchitecture="${{ matrix.arch }}" />
            <Properties>
              <DisplayName>Winhance</DisplayName>
              <PublisherDisplayName>Winhance Team</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
              <Description>Windows Enhancement and Optimization Tool</Description>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Applications>
              <Application Id="Winhance" Executable="Winhance.WPF.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="Winhance" Description="Windows Enhancement Tool" BackgroundColor="#1E1E1E" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" Square71x71Logo="Assets\Square71x71Logo.png" Square310x310Logo="Assets\Square310x310Logo.png" ShortName="Winhance">
                    <uap:ShowNameOnTiles>
                      <uap:ShowOn Tile="square150x150Logo"/>
                      <uap:ShowOn Tile="wide310x150Logo"/>
                      <uap:ShowOn Tile="square310x310Logo"/>
                    </uap:ShowNameOnTiles>
                  </uap:DefaultTile>
                  <uap:SplashScreen Image="Assets\SplashScreen.png" BackgroundColor="#1E1E1E"/>
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
              <rescap:Capability Name="allowElevation" />
            </Capabilities>
          </Package>
          "@
          $manifest | Out-File -FilePath "$msixDir/AppxManifest.xml" -Encoding UTF8

          # Create Assets directory with proper logos
          New-Item -ItemType Directory -Force -Path "$msixDir/Assets"
          
          # Create proper sized placeholder PNGs (50x50 for store logo)
          # StoreLogo.png (50x50)
          $storeLogo50 = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AEXBwAA5xCKVAAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLmUHAAAAFklEQVRo3u3BMQEAAADCoPVP7WsIoAAAeAMPMAABpQYSbgAAAABJRU5ErkJggg==")
          [IO.File]::WriteAllBytes("$msixDir/Assets/StoreLogo.png", $storeLogo50)
          
          # Square logos (using same placeholder)
          [IO.File]::WriteAllBytes("$msixDir/Assets/Square44x44Logo.png", $storeLogo50)
          [IO.File]::WriteAllBytes("$msixDir/Assets/Square71x71Logo.png", $storeLogo50)
          [IO.File]::WriteAllBytes("$msixDir/Assets/Square150x150Logo.png", $storeLogo50)
          [IO.File]::WriteAllBytes("$msixDir/Assets/Square310x310Logo.png", $storeLogo50)
          [IO.File]::WriteAllBytes("$msixDir/Assets/Wide310x150Logo.png", $storeLogo50)
          [IO.File]::WriteAllBytes("$msixDir/Assets/SplashScreen.png", $storeLogo50)

          # Find Windows SDK makeappx.exe
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          
          if ($sdkPath) {
            $makeAppx = $sdkPath.FullName
            Write-Host "Found makeappx.exe at: $makeAppx"
            
            # Create .msix package (unsigned - for sideloading/testing)
            $msixFile = "./publish/Winhance-${{ matrix.arch }}-${{ steps.version.outputs.version }}.msix"
            & $makeAppx pack /d $msixDir /p $msixFile /nv
            
            if (Test-Path $msixFile) {
              $hash = Get-FileHash $msixFile -Algorithm SHA256
              Set-Content -Path "$msixFile.sha256" -Value "$($hash.Hash)  $(Split-Path $msixFile -Leaf)"
              Write-Host "Created MSIX: $msixFile"
            }
          } else {
            Write-Host "makeappx.exe not found, creating ZIP package instead"
          }

          # Also create ZIP version for manual inspection/sideloading
          $zipName = "Winhance-MSIX-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "$msixDir/*" -DestinationPath "./publish/$zipName" -Force

          $hash = Get-FileHash "./publish/$zipName" -Algorithm SHA256
          Set-Content -Path "./publish/$zipName.sha256" -Value "$($hash.Hash)  $zipName"

          Write-Host "Created MSIX ZIP package: $zipName"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-MSIX-${{ matrix.arch }}
          path: |
            ./publish/Winhance-${{ matrix.arch }}-${{ steps.version.outputs.version }}.msix
            ./publish/Winhance-${{ matrix.arch }}-${{ steps.version.outputs.version }}.msix.sha256
            ./publish/Winhance-MSIX-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip
            ./publish/Winhance-MSIX-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip.sha256
          retention-days: 30

  # MSIX Bundle Creation (combines all architectures)
  msix-bundle:
    name: Create MSIX Bundle
    runs-on: windows-latest
    needs: msix-build

    steps:
      - name: Download all MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Winhance-MSIX-*
          path: ./msix-packages

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          # Find Windows SDK makeappx.exe
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          
          if ($sdkPath) {
            $makeAppx = $sdkPath.FullName
            Write-Host "Found makeappx.exe at: $makeAppx"
            
            # Create bundle directory
            New-Item -ItemType Directory -Force -Path ./bundle-input
            
            # Copy all .msix files to bundle directory
            Get-ChildItem -Path ./msix-packages -Recurse -Filter "*.msix" | ForEach-Object {
              Copy-Item $_.FullName -Destination ./bundle-input/
              Write-Host "Added to bundle: $($_.Name)"
            }
            
            # Create .msixbundle (combines x64, x86, arm64)
            # Extract numeric version for bundle (X.X.X.X format required)
            $numericVersion = "${{ steps.version.outputs.version }}" -replace '^v','' -replace '-.*$',''
            if ($numericVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              $parts = $numericVersion.Split('.')
              while ($parts.Count -lt 4) { $parts += '0' }
              $numericVersion = $parts[0..3] -join '.'
            }
            
            $bundleFile = "./Winhance-${{ steps.version.outputs.version }}.msixbundle"
            & $makeAppx bundle /d ./bundle-input /p $bundleFile /bv $numericVersion
            
            if (Test-Path $bundleFile) {
              $hash = Get-FileHash $bundleFile -Algorithm SHA256
              Set-Content -Path "$bundleFile.sha256" -Value "$($hash.Hash)  $(Split-Path $bundleFile -Leaf)"
              Write-Host "Created MSIX Bundle: $bundleFile"
            }
          } else {
            Write-Host "makeappx.exe not found, creating ZIP bundle instead"
            
            # Fallback: create ZIP bundle
            Get-ChildItem -Path ./msix-packages -Recurse -Filter "*.msix" | ForEach-Object {
              Copy-Item $_.FullName -Destination ./
            }
            $bundleZip = "./Winhance-msixbundle-${{ steps.version.outputs.version }}.zip"
            Get-ChildItem -Filter "*.msix" | Compress-Archive -DestinationPath $bundleZip -Force
            
            $hash = Get-FileHash $bundleZip -Algorithm SHA256
            Set-Content -Path "$bundleZip.sha256" -Value "$($hash.Hash)  $(Split-Path $bundleZip -Leaf)"
          }

      - name: Upload MSIX Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-MSIX-Bundle
          path: |
            ./Winhance-*.msixbundle
            ./Winhance-*.msixbundle.sha256
            ./Winhance-msixbundle-*.zip
            ./Winhance-msixbundle-*.zip.sha256
          retention-days: 30

  # APPX Build (Legacy Windows Store format)
  appx-build:
    name: Build APPX ${{ matrix.arch }}
    runs-on: windows-latest
    needs: rust-build
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            runtime: win-x64
          - arch: x86
            runtime: win-x86

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          ASSEMBLY_VERSION=$(echo "$VERSION_NUM" | sed 's/-.*$//' | sed 's/^\([0-9]*\.[0-9]*\.[0-9]*\)$/\1.0/' | sed 's/^\([0-9]*\.[0-9]*\)$/\1.0.0/' | sed 's/^\([0-9]*\)$/\1.0.0.0/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "assembly_version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build APPX package
        shell: pwsh
        run: |
          # Build the application
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.version_num }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} `
            --output ./publish/appx-${{ matrix.arch }}

          # Create APPX directory structure
          $appxDir = "./appx-package"
          New-Item -ItemType Directory -Force -Path $appxDir
          Copy-Item -Path "./publish/appx-${{ matrix.arch }}/*" -Destination $appxDir -Recurse

          # Create AppxManifest.xml for APPX (legacy format)
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="Winhance.Winhance" Publisher="CN=Winhance" Version="${{ steps.version.outputs.assembly_version }}" ProcessorArchitecture="${{ matrix.arch }}" />
            <Properties>
              <DisplayName>Winhance</DisplayName>
              <PublisherDisplayName>Winhance Team</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.14393.0" MaxVersionTested="10.0.19041.0" />
            </Dependencies>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Applications>
              <Application Id="Winhance" Executable="Winhance.WPF.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="Winhance" Description="Windows Enhancement Tool" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
          </Package>
          "@
          $manifest | Out-File -FilePath "$appxDir/AppxManifest.xml" -Encoding UTF8

          # Create Assets
          New-Item -ItemType Directory -Force -Path "$appxDir/Assets"
          $pngBytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AEXBwAA5xCKVAAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLmUHAAAAFklEQVRo3u3BMQEAAADCoPVP7WsIoAAAeAMPMAABpQYSbgAAAABJRU5ErkJggg==")
          [IO.File]::WriteAllBytes("$appxDir/Assets/StoreLogo.png", $pngBytes)
          [IO.File]::WriteAllBytes("$appxDir/Assets/Square44x44Logo.png", $pngBytes)
          [IO.File]::WriteAllBytes("$appxDir/Assets/Square150x150Logo.png", $pngBytes)
          [IO.File]::WriteAllBytes("$appxDir/Assets/Wide310x150Logo.png", $pngBytes)

          # Find Windows SDK makeappx.exe
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          
          if ($sdkPath) {
            $makeAppx = $sdkPath.FullName
            
            # Create .appx package
            $appxFile = "./publish/Winhance-${{ matrix.arch }}-${{ steps.version.outputs.version }}.appx"
            & $makeAppx pack /d $appxDir /p $appxFile /nv
            
            if (Test-Path $appxFile) {
              $hash = Get-FileHash $appxFile -Algorithm SHA256
              Set-Content -Path "$appxFile.sha256" -Value "$($hash.Hash)  $(Split-Path $appxFile -Leaf)"
              Write-Host "Created APPX: $appxFile"
            }
          }

          # Also create ZIP version
          $zipName = "Winhance-APPX-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "$appxDir/*" -DestinationPath "./publish/$zipName" -Force
          
          $hash = Get-FileHash "./publish/$zipName" -Algorithm SHA256
          Set-Content -Path "./publish/$zipName.sha256" -Value "$($hash.Hash)  $zipName"

      - name: Upload APPX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-APPX-${{ matrix.arch }}
          path: |
            ./publish/Winhance-${{ matrix.arch }}-${{ steps.version.outputs.version }}.appx
            ./publish/Winhance-${{ matrix.arch }}-${{ steps.version.outputs.version }}.appx.sha256
            ./publish/Winhance-APPX-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip
            ./publish/Winhance-APPX-${{ matrix.arch }}-${{ steps.version.outputs.version }}.zip.sha256
          retention-days: 30

  # APPX Bundle Creation
  appx-bundle:
    name: Create APPX Bundle
    runs-on: windows-latest
    needs: appx-build

    steps:
      - name: Download all APPX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Winhance-APPX-*
          path: ./appx-packages

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create APPX Bundle
        shell: pwsh
        run: |
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          
          if ($sdkPath) {
            $makeAppx = $sdkPath.FullName
            
            New-Item -ItemType Directory -Force -Path ./bundle-input
            
            Get-ChildItem -Path ./appx-packages -Recurse -Filter "*.appx" | ForEach-Object {
              Copy-Item $_.FullName -Destination ./bundle-input/
              Write-Host "Added to bundle: $($_.Name)"
            }
            
            # Extract numeric version for bundle (X.X.X.X format required)
            $numericVersion = "${{ steps.version.outputs.version }}" -replace '^v','' -replace '-.*$',''
            if ($numericVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              $parts = $numericVersion.Split('.')
              while ($parts.Count -lt 4) { $parts += '0' }
              $numericVersion = $parts[0..3] -join '.'
            }
            
            $bundleFile = "./Winhance-${{ steps.version.outputs.version }}.appxbundle"
            & $makeAppx bundle /d ./bundle-input /p $bundleFile /bv $numericVersion
            
            if (Test-Path $bundleFile) {
              $hash = Get-FileHash $bundleFile -Algorithm SHA256
              Set-Content -Path "$bundleFile.sha256" -Value "$($hash.Hash)  $(Split-Path $bundleFile -Leaf)"
              Write-Host "Created APPX Bundle: $bundleFile"
            }
          } else {
            # Fallback
            $bundleZip = "./Winhance-appxbundle-${{ steps.version.outputs.version }}.zip"
            Get-ChildItem -Path ./appx-packages -Recurse -Filter "*.appx" | Compress-Archive -DestinationPath $bundleZip -Force
            
            $hash = Get-FileHash $bundleZip -Algorithm SHA256
            Set-Content -Path "$bundleZip.sha256" -Value "$($hash.Hash)  $(Split-Path $bundleZip -Leaf)"
          }

      - name: Upload APPX Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-APPX-Bundle
          path: |
            ./Winhance-*.appxbundle
            ./Winhance-*.appxbundle.sha256
            ./Winhance-appxbundle-*.zip
            ./Winhance-appxbundle-*.zip.sha256
          retention-days: 30

  # Setup.exe Installer Build
  installer-build:
    name: Build Setup Installer
    runs-on: windows-latest
    needs: build
    # Runs even if an unrelated matrix variant failed; fails on its own if the artifact it needs is missing.
    if: ${{ always() && needs.build.result != 'cancelled' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Winhance-x64
          path: ./x64-build

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          # Extract the x64 build
          $zipFile = Get-ChildItem -Path ./x64-build -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath ./app-files -Force

          # Create Inno Setup script
          $issContent = @"
          [Setup]
          AppId={{8F3C2A71-5B4E-4D2A-9C1E-6A7B3D9E2F14}
          AppName=Winhance-FS
          AppVersion=${{ steps.version.outputs.version }}
          AppVerName=Winhance-FS ${{ steps.version.outputs.version }}
          AppPublisher=Ghenghis
          AppPublisherURL=https://github.com/Ghenghis/Winhance-FS
          AppSupportURL=https://github.com/Ghenghis/Winhance-FS/issues
          AppUpdatesURL=https://github.com/Ghenghis/Winhance-FS/releases
          DefaultDirName={autopf}\Winhance-FS
          DefaultGroupName=Winhance-FS
          DisableProgramGroupPage=yes
          OutputDir=.\output
          OutputBaseFilename=Winhance-FS-Setup-${{ steps.version.outputs.version }}
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0
          PrivilegesRequired=admin
          CloseApplications=yes
          UninstallDisplayIcon={app}\Winhance.exe
          UninstallDisplayName=Winhance-FS

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "app-files\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Winhance-FS"; Filename: "{app}\Winhance.exe"
          Name: "{autodesktop}\Winhance-FS"; Filename: "{app}\Winhance.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\Winhance.exe"; Description: "{cm:LaunchProgram,Winhance-FS}"; Flags: nowait postinstall skipifsilent shellexec
          "@

          if (-not (Test-Path ./app-files/Winhance.exe)) { throw "Winhance.exe not found in the x64 package" }
          $issContent | Out-File -FilePath "setup.iss" -Encoding UTF8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          
          # Calculate SHA256
          $setupFile = Get-ChildItem -Path ./output -Filter "*.exe" | Select-Object -First 1
          $hash = Get-FileHash $setupFile.FullName -Algorithm SHA256
          Set-Content -Path "$($setupFile.FullName).sha256" -Value "$($hash.Hash)  $($setupFile.Name)"

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-Setup
          path: |
            ./output/*.exe
            ./output/*.sha256
          retention-days: 30

  # MSI Installer Build using WiX
  msi-build:
    name: Build MSI Installer
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Winhance-x64
          path: ./x64-build

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          # Extract numeric only for MSI (must be X.X.X.X format)
          MSI_VERSION=$(echo "$VERSION_NUM" | sed 's/-.*$//' | sed 's/^\([0-9]*\.[0-9]*\.[0-9]*\)$/\1.0/' | sed 's/^\([0-9]*\.[0-9]*\)$/\1.0.0/' | sed 's/^\([0-9]*\)$/\1.0.0.0/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "msi_version=$MSI_VERSION" >> $GITHUB_OUTPUT

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix

      - name: Create MSI package
        shell: pwsh
        run: |
          # Extract the x64 build
          $zipFile = Get-ChildItem -Path ./x64-build -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath ./app-files -Force

          # Create WiX source file
          $wxsContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="Winhance" Manufacturer="Winhance Team" Version="${{ steps.version.outputs.msi_version }}" UpgradeCode="12345678-1234-1234-1234-123456789012">
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="Winhance" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
              </Feature>
            </Package>
            <Fragment>
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="Winhance" />
              </StandardDirectory>
            </Fragment>
            <Fragment>
              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <Component Id="MainExecutable">
                  <File Source="app-files\Winhance.WPF.exe" />
                </Component>
              </ComponentGroup>
            </Fragment>
          </Wix>
          "@
          $wxsContent | Out-File -FilePath "Product.wxs" -Encoding UTF8

          # Build MSI (simplified - full WiX build requires more setup)
          New-Item -ItemType Directory -Force -Path ./msi-output

          # For now, create a self-extracting archive as MSI alternative
          $msiName = "Winhance-MSI-x64-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path ./app-files/* -DestinationPath "./msi-output/$msiName" -Force

          # Calculate SHA256
          $hash = Get-FileHash "./msi-output/$msiName" -Algorithm SHA256
          Set-Content -Path "./msi-output/$msiName.sha256" -Value "$($hash.Hash)  $msiName"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-MSI-Installer
          path: |
            ./msi-output/*.zip
            ./msi-output/*.sha256
          retention-days: 30

  # Chocolatey Package Build
  chocolatey-build:
    name: Build Chocolatey Package
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 portable artifact
        uses: actions/download-artifact@v4
        with:
          name: Winhance-x64-Portable
          path: ./portable-build

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          # Chocolatey version format
          CHOCO_VERSION=$(echo "$VERSION_NUM" | sed 's/-/./g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "choco_version=$CHOCO_VERSION" >> $GITHUB_OUTPUT

      - name: Create Chocolatey package
        shell: pwsh
        run: |
          # Create package structure
          New-Item -ItemType Directory -Force -Path ./choco-package/tools

          # Create nuspec file
          $nuspecContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>winhance</id>
              <version>${{ steps.version.outputs.choco_version }}</version>
              <title>Winhance</title>
              <authors>Winhance Team</authors>
              <projectUrl>https://github.com/Ghenghis/Winhance-FS</projectUrl>
              <tags>windows optimization enhancement utility</tags>
              <summary>Windows Enhancement and Optimization Tool</summary>
              <description>Winhance is a comprehensive Windows enhancement and optimization tool.</description>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@
          $nuspecContent | Out-File -FilePath "./choco-package/winhance.nuspec" -Encoding UTF8

          # Create install script
          $installScript = @"
          `$ErrorActionPreference = 'Stop'
          `$toolsDir = "`$(Split-Path -parent `$MyInvocation.MyCommand.Definition)"
          `$exePath = Join-Path `$toolsDir 'Winhance.WPF.exe'

          # Extract portable exe
          `$zipFile = Get-ChildItem -Path `$toolsDir -Filter "*.zip" | Select-Object -First 1
          if (`$zipFile) {
              Expand-Archive -Path `$zipFile.FullName -DestinationPath `$toolsDir -Force
          }

          # Create shim
          Install-BinFile -Name 'winhance' -Path `$exePath
          "@
          $installScript | Out-File -FilePath "./choco-package/tools/chocolateyinstall.ps1" -Encoding UTF8

          # Copy portable build
          Copy-Item -Path "${{ github.workspace }}/portable-build/*.zip" -Destination "${{ github.workspace }}/choco-package/tools/"

          # Create output directory
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/choco-output"

          # Create nupkg
          $nupkgName = "winhance.${{ steps.version.outputs.choco_version }}.nupkg"
          $outputDir = "${{ github.workspace }}/choco-output"
          Compress-Archive -Path "${{ github.workspace }}/choco-package/*" -DestinationPath "$outputDir/$nupkgName.zip" -Force
          Rename-Item -Path "$outputDir/$nupkgName.zip" -NewName $nupkgName

          # Calculate SHA256
          $hash = Get-FileHash "$outputDir/$nupkgName" -Algorithm SHA256
          Set-Content -Path "$outputDir/$nupkgName.sha256" -Value "$($hash.Hash)  $nupkgName"

      - name: Upload Chocolatey artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-Chocolatey
          path: |
            ${{ github.workspace }}/choco-output/*.nupkg
            ${{ github.workspace }}/choco-output/*.sha256
          retention-days: 30

  # WinGet Manifest Build
  winget-build:
    name: Build WinGet Manifest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Create WinGet manifest
        run: |
          mkdir -p winget-manifest

          # Create version manifest
          cat > winget-manifest/Winhance.yaml << 'EOF'
          PackageIdentifier: Winhance.Winhance
          PackageVersion: ${{ steps.version.outputs.version_num }}
          PackageLocale: en-US
          Publisher: Winhance Team
          PackageName: Winhance
          License: MIT
          ShortDescription: Windows Enhancement and Optimization Tool
          Description: Winhance is a comprehensive Windows enhancement and optimization tool for Windows 10/11.
          Tags:
            - windows
            - optimization
            - enhancement
            - utility
            - system
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: https://github.com/Ghenghis/Winhance-FS/releases/download/${{ steps.version.outputs.version }}/Winhance-x64-${{ steps.version.outputs.version }}.zip
            - Architecture: x86
              InstallerType: zip
              InstallerUrl: https://github.com/Ghenghis/Winhance-FS/releases/download/${{ steps.version.outputs.version }}/Winhance-x86-${{ steps.version.outputs.version }}.zip
            - Architecture: arm64
              InstallerType: zip
              InstallerUrl: https://github.com/Ghenghis/Winhance-FS/releases/download/${{ steps.version.outputs.version }}/Winhance-ARM64-${{ steps.version.outputs.version }}.zip
          ManifestType: singleton
          ManifestVersion: 1.4.0
          EOF

          # Create zip of manifests
          cd winget-manifest
          zip -r ../Winhance-WinGet-Manifest-${{ steps.version.outputs.version }}.zip .
          cd ..

          # Calculate SHA256
          sha256sum Winhance-WinGet-Manifest-${{ steps.version.outputs.version }}.zip > Winhance-WinGet-Manifest-${{ steps.version.outputs.version }}.zip.sha256

      - name: Upload WinGet manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-WinGet-Manifest
          path: |
            Winhance-WinGet-Manifest-*.zip
            Winhance-WinGet-Manifest-*.sha256
          retention-days: 30

  # Squirrel.Windows Auto-Update Package
  squirrel-build:
    name: Build Squirrel Package
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Winhance-x64
          path: ./x64-build

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          # Squirrel needs semantic version
          SQUIRREL_VERSION=$(echo "$VERSION_NUM" | sed 's/-.*$//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "squirrel_version=$SQUIRREL_VERSION" >> $GITHUB_OUTPUT

      - name: Create Squirrel package structure
        shell: pwsh
        run: |
          # Extract the x64 build
          $zipFile = Get-ChildItem -Path ./x64-build -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath ./squirrel-files -Force

          # Create nuspec for Squirrel
          $nuspecContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd">
            <metadata>
              <id>Winhance</id>
              <version>${{ steps.version.outputs.squirrel_version }}</version>
              <title>Winhance</title>
              <authors>Winhance Team</authors>
              <description>Windows Enhancement and Optimization Tool</description>
            </metadata>
            <files>
              <file src="squirrel-files\**\*.*" target="lib\net9.0" />
            </files>
          </package>
          "@
          $nuspecContent | Out-File -FilePath "Winhance.nuspec" -Encoding UTF8

          # Create Squirrel-ready package
          New-Item -ItemType Directory -Force -Path ./squirrel-output
          $squirrelZip = "Winhance-Squirrel-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path ./squirrel-files/*, ./Winhance.nuspec -DestinationPath "./squirrel-output/$squirrelZip" -Force

          # Calculate SHA256
          $hash = Get-FileHash "./squirrel-output/$squirrelZip" -Algorithm SHA256
          Set-Content -Path "./squirrel-output/$squirrelZip.sha256" -Value "$($hash.Hash)  $squirrelZip"

      - name: Upload Squirrel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-Squirrel
          path: |
            ./squirrel-output/*.zip
            ./squirrel-output/*.sha256
          retention-days: 30

  # ClickOnce Deployment Package
  clickonce-build:
    name: Build ClickOnce Package
    runs-on: windows-latest
    needs: rust-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          ASSEMBLY_VERSION=$(echo "$VERSION_NUM" | sed 's/-.*$//' | sed 's/^\([0-9]*\.[0-9]*\.[0-9]*\)$/\1.0/' | sed 's/^\([0-9]*\.[0-9]*\)$/\1.0.0/' | sed 's/^\([0-9]*\)$/\1.0.0.0/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "assembly_version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build ClickOnce package
        shell: pwsh
        run: |
          # Build with ClickOnce manifest generation
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.version_num }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} `
            --output ./clickonce-files

          # Create ClickOnce-style deployment structure
          New-Item -ItemType Directory -Force -Path ./clickonce-output

          $clickOnceZip = "Winhance-ClickOnce-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path ./clickonce-files/* -DestinationPath "./clickonce-output/$clickOnceZip" -Force

          # Calculate SHA256
          $hash = Get-FileHash "./clickonce-output/$clickOnceZip" -Algorithm SHA256
          Set-Content -Path "./clickonce-output/$clickOnceZip.sha256" -Value "$($hash.Hash)  $clickOnceZip"

      - name: Upload ClickOnce artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winhance-ClickOnce
          path: |
            ./clickonce-output/*.zip
            ./clickonce-output/*.sha256
          retention-days: 30

  release:
    name: Create Release
    # Waits for every packaging job, but only the core assets (portable/standard zips, verified x64 build and
    # the Setup installer) are required. Store, MSI, Chocolatey, WinGet, Squirrel and ClickOnce packages are
    # attached when they succeed and skipped when they fail, so they can never block a release again.
    needs: [rust-build, build, verify, msix-build, msix-bundle, appx-build, appx-bundle, installer-build, msi-build, chocolatey-build, winget-build, squirrel-build, clickonce-build]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      needs.build.result != 'cancelled' &&
      needs.verify.result == 'success' &&
      needs.installer-build.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${{ steps.version.outputs.version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || echo "")

          V="${{ steps.version.outputs.version }}"
          {
            echo "## Winhance-FS $V"
            echo ""
            echo "### Which file should I download?"
            echo ""
            echo "- **Most people:** \`Winhance-FS-Setup-$V.exe\` (installer with Start Menu entry and uninstaller)"
            echo "- **No install:** \`Winhance-x64-Portable-$V.zip\` (self-contained, unzip and run \`Winhance.exe\`)"
            echo "- **Already have the .NET 9 Desktop Runtime:** a \`FrameworkDependent\` zip (smaller)"
            echo "- **32-bit / ARM devices:** the \`x86\` / \`ARM64\` zips"
            echo ""
            echo "Windows 10 or 11. Winhance-FS asks for administrator rights when it starts."
            echo ""
            echo "### Files in this release"
            echo ""
            find ./artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.msix*' -o -name '*.appx*' -o -name '*.nupkg' \) \
              -printf '%f\n' | sort | sed 's/^/- `/; s/$/`/'
          } > release_body.md

          echo "" >> release_body.md
          echo "### Changes" >> release_body.md
          echo "" >> release_body.md

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release" >> release_body.md
          else
            git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD --no-merges >> release_body.md
          fi

          echo "" >> release_body.md
          echo "" >> release_body.md
          echo "### Checksums (SHA256)" >> release_body.md
          echo "" >> release_body.md
          echo '```' >> release_body.md
          find ./artifacts -name "*.sha256" -exec cat {} \; >> release_body.md
          echo '```' >> release_body.md

          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Winhance-FS ${{ steps.version.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: false
          files: |
            ./artifacts/**/*.zip
            ./artifacts/**/*.exe
            ./artifacts/**/*.msix
            ./artifacts/**/*.msixbundle
            ./artifacts/**/*.appx
            ./artifacts/**/*.appxbundle
            ./artifacts/**/*.nupkg
            ./artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify Build
    needs: build
    # Runs even if an unrelated matrix variant failed; fails on its own if the artifact it needs is missing.
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: windows-latest

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Winhance-x64
          path: ./verify

      - name: Verify x64 package
        shell: pwsh
        run: |
          $zipFiles = Get-ChildItem -Path ./verify -Filter "*.zip"
          foreach ($zip in $zipFiles) {
            Write-Host "Verifying: $($zip.Name)"

            # Verify SHA256
            $sha256File = "$($zip.FullName).sha256"
            if (Test-Path $sha256File) {
              $expectedHash = (Get-Content $sha256File).Split(" ")[0]
              $actualHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash

              if ($expectedHash -eq $actualHash) {
                Write-Host "✅ SHA256 verified: $actualHash" -ForegroundColor Green
              } else {
                Write-Host "❌ SHA256 mismatch!" -ForegroundColor Red
                Write-Host "Expected: $expectedHash"
                Write-Host "Actual: $actualHash"
                exit 1
              }
            }

            # Extract and verify contents
            $extractPath = "./extract"
            Expand-Archive -Path $zip.FullName -DestinationPath $extractPath -Force

            $exeFiles = Get-ChildItem -Path $extractPath -Filter "*.exe" -Recurse
            if ($exeFiles.Count -eq 0) {
              Write-Host "❌ No executable found in package!" -ForegroundColor Red
              exit 1
            }

            foreach ($exe in $exeFiles) {
              Write-Host "✅ Found executable: $($exe.Name)" -ForegroundColor Green
            }
          }

          Write-Host ""
          Write-Host "✅ All verifications passed!" -ForegroundColor Green
