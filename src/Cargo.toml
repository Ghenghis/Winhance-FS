[workspace]
resolver = "2"
members = ["nexus_core"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"
authors = ["Ghenghis"]

[workspace.dependencies]
# Search
tantivy = "0.22"

# File System
walkdir = "2.5"
notify = "6.1"

# Windows APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"



# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }


# Additional
