[package]
name = "nexus_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ultra-fast file indexing core for NexusFS"

[lib]
name = "nexus_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Search
tantivy = { workspace = true, optional = true }

# File System
walkdir.workspace = true
notify.workspace = true

# Windows APIs for MFT/USN access
windows.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Hashing
xxhash-rust.workspace = true
sha2.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Date/Time
chrono.workspace = true


# Additional
parking_lot = "0.12"
dashmap = "6.0"
rayon = "1.10"
num_cpus = "1.16"
once_cell = "1.19"

[features]
# Tantivy full-text engine (search::SearchEngine). Off by default: the app uses the name index, and Tantivy
# pulls in C code (zstd) that complicates cross-compiling for ARM64.
fulltext = ["dep:tantivy"]

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "indexer_bench"
harness = false
